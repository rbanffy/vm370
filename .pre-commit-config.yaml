default_language_version:
  python: python3

repos:
  - repo: local
    hooks:
      - id: makefile-parse
        name: validate Makefile
        entry: make --dry-run help
        language: system
        pass_filenames: false
        files: ^Makefile$

  - repo: local
    hooks:
      - id: hadolint
        name: lint Dockerfiles
        entry: hadolint --ignore DL3008 --ignore DL3009
        language: system
        files: ^Dockerfile[^/]*$
        types: [file]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2
        files: \.md$